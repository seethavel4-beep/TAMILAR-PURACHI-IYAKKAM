<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>தமிழர் புரட்சி இயக்கம்</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
.page{display:none;min-height:100vh;padding:15px;padding-bottom:140px}
.page.active{display:block}
.head{text-align:center;padding:12px;padding-top:55px;border-bottom:2px solid gold;margin-bottom:15px}
.head h1{color:gold;font-size:20px}
.content{max-width:650px;margin:0 auto;line-height:1.9}
.box{background:#111;border:1.5px solid #333;border-radius:12px;padding:15px;margin:12px 0}
.gold{color:gold}
.btn{display:inline-block;background:gold;color:#8B0000;padding:14px 24px;border-radius:28px;font-weight:900;text-decoration:none;margin:8px;border:none;cursor:pointer;font-size:16px}
#nav{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;border:2.5px solid gold;border-radius:30px;padding:12px 22px;z-index:9999;display:flex;gap:16px;align-items:center;box-shadow:0 0 20px gold}
.navbtn{background:gold;color:#8B0000;border:none;padding:10px 20px;border-radius:20px;font-weight:900;font-size:18px;cursor:pointer}
.topbtn{position:fixed;top:10px;right:10px;z-index:9999;background:gold;color:#8B0000;padding:8px 14px;border-radius:20px;font-weight:900;text-decoration:none;font-size:12px}
.flagimg{width:100%;max-width:450px;border:3px solid gold;border-radius:15px;margin:10px auto;display:block}
.leader-round{width:160px;height:160px;border:4px solid gold;border-radius:50%;object-fit:cover;margin:15px auto;display:block;box-shadow:0 0 15px gold}
</style>
</head>
