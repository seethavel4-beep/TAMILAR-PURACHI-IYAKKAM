<div id="p10" style="background:#000;padding:20px;text-align:center"><h2 style="color:gold">🐯 ID CARD 🐯</h2><div id="idcard" style="max-width:350px;margin:15px auto;background:#fff;color:#000;border:3px solid gold;border-radius:10px;padding:15px"><div style="text-align:center;font-weight:900;color:#8B0000">TAMILAR PURATCHI IYAKKAM</div><div style="margin-top:10px;text-align:left;font-size:14px"><b>Name:</b> <span id="cName">-</span><br><b>Phone:</b> <span id="cPhone">-</span><br><b>Place:</b> <span id="cPlace">-</span><br><b>ID:</b> TPI-<span id="cID"></span><br><b>Date:</b> <span id="cDate"></span></div></div><button onclick="downloadCard()" style="background:gold;color:#8B0000;padding:12px 25px;border:none;border-radius:20px;font-weight:900">📥 DOWNLOAD</button><br><br><a href="member-join.html" style="color:gold">← Login</a></div>
