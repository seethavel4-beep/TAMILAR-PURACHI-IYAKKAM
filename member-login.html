<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login - Tamilar Puratchi Iyakkam</title>
<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#1a1a1a;padding:30px;border-radius:15px;width:90%;max-width:400px;border:1px solid #ff0000;box-shadow:0 0 20px rgba(255,0,0,0.3)}
h2{text-align:center;color:#ffcc00;margin-bottom:20px}
label{display:block;margin:10px 0 5px;color:#ddd}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#222;color:white;box-sizing:border-box}
button{width:100%;padding:12px;margin-top:20px;background:linear-gradient(90deg,#ff0000,#ffcc00);border:none;border-radius:8px;color:black;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{opacity:0.9}
.back{text-align:center;margin-top:15px}
.back a{color:#ffcc00;text-decoration:none}
.flag{width:100%;max-height:120px;object-fit:contain;margin-bottom:15px;border-radius:8px}
</style>
</head>
<body>
<div class="card">
<img src="flag.jpg" class="flag" alt="Flag">
<h2>உறுப்பினர் உள்நுழைவு</h2>
<form onsubmit="login(event)">
<label>Member ID / Phone Number</label>
<input type="text" id="mid" placeholder="ID / Phone Enter pannunga" required>
<label>Password</label>
<input type="password" id="pwd" placeholder="Password" required>
<button type="submit">LOGIN</button>
</form>
<div class="back">
<a href="index.html">← Home ku Ponga</a>
<br><br>
<p style="font-size:12px;color:#aaa">New Member? Admin kitta Contact pannunga</p>
</div>
</div>
<script>
function login(e){
e.preventDefault();
let id=document.getElementById('mid').value;
let pwd=document.getElementById('pwd').value;
if(id && pwd){
alert("Vanakkam "+id+"! Login Success (Demo) - Database Connect Pannanum Anna!");
// Inga Google Sheet / Database Connect Pannalam
}else{
alert("ID & Password Enter pannunga Anna!");
}
}
</script>
</body>
  </html>
