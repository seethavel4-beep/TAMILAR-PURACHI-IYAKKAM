<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TPI FORM FIX</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;padding:6px}.head{background:#c00;color:gold;padding:10px;text-align:center;font-weight:900;border:2px solid gold;border-radius:8px}.form{max-width:500px;margin:10px auto;background:#fff;padding:12px;border-radius:10px;border:3px solid gold}.field{margin-bottom:8px}.field label{display:block;color:#c00;font-weight:900;font-size:12px;margin-bottom:2px}.field input,.field select{width:100%;padding:10px;border:2px solid #c00;border-radius:6px;font-weight:bold;font-size:14px;color:#000;background:#fff}.field input::placeholder{color:#666;font-weight:bold}.field input[type=file]{padding:6px;background:#fffbe6}.btn{width:100%;padding:12px;background:#c00;color:#fff;border:2px solid gold;border-radius:20px;font-weight:900;margin-top:8px;font-size:15px}.cards{display:none;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}.card-front{width:340px;height:485px;background:#8B0000;border:3px solid gold;border-radius:9px;overflow:hidden}.card-back{width:340px;height:260px;background:#8B0000;border:3px solid gold;border-radius:9px;overflow:hidden}.inner{border:2px solid gold;margin:4px;height:calc(100% - 8px);border-radius:5px;padding:7px;color:gold;position:relative}.thalaivar-box{width:185px;height:225px;border:3px solid gold;border-radius:7px;margin:6px auto;overflow:hidden;background:#fff}.thalaivar-box img{width:100%;height:100%;object-fit:cover}.bg{position:absolute;bottom:0;left:0;right:0;background:gold;color:#8B0000;font-weight:900;text-align:center;padding:4px;font-size:8px}.m-photo{width:90px;height:108px;border:2px solid gold;float:left;margin-right:7px;background:#222;overflow:hidden;border-radius:4px}.m-photo img{width:100%;height:100%;object-fit:cover}.sign-box{position:absolute;right:6px;bottom:22px;background:#fff;padding:4px 6px;border-radius:5px;border:2px solid gold;width:110px;text-align:center}.sign-box img{width:95px;height:45px;object-fit:contain}</style></head><body><div class="head">🐯 TAMILAR PURATCHI IYAKKAM<br>ID CARD GENERATOR</div><div class="form" id="formDiv"><div class="field"><label>1. Name / பெயர் *</label><input id="name" placeholder="Ex: VELMURUGAN ANNAMALAI"></div><div class="field"><label>2. Member Photo *</label><input type="file" id="photoInput" accept="image/*"></div><div class="field"><label>3. ID No / அடையாள எண் *</label><input id="voter" placeholder="Ex: UBU0443952"></div><div class="field"><label>4. Oor / ஊர் *</label><input id="kiramam" placeholder="Ex: Aruppukkottai"></div><div class="field"><label>5. Mavattam / மாவட்டம் *</label><input id="mavattam" placeholder="Ex: Virudhunagar"></div><div class="field"><label>6. Pathavi / பதவி</label><select id="pathavi"><option>உறுப்பினர்</option><option selected>ஒருங்கிணைப்பாளர்</option><option>மாவட்ட செயலாளர்</option><option>மாநில தலைவர்</option></select></div><button class="btn" onclick="makeCard()">✅ GENERATE ID CARD</button></div><div class="cards" id="cardDiv"></div><div style="text-align:center;display:none" id="printDiv"><button class="btn" style="max-width:260px;background:#000" onclick="window.print()">🖨️ PRINT</button><button class="btn" style="max-width:260px;background:#333" onclick="location.reload()">🔄 NEW MEMBER</button></div><script>var mUrl="";document.getElementById('photoInput').addEventListener('change',function(e){if(e.target.files[0])mUrl=URL.createObjectURL(e.target.files[0])});function makeCard(){var n=document.getElementById('name').value||"VELMURUGAN ANNAMALAI";var v=document.getElementById('voter').value||"UBU0443952";var k=document.getElementById('kiramam').value||"Aruppukkottai";var m=document.getElementById('mavattam').value||"Virudhunagar";var p=document.getElementById('pathavi').value;if(!mUrl){alert("Member Photo select pannunga Anna!")}document.getElementById('formDiv').style.display="none";document.getElementById('cardDiv').style.display="flex";document.getElementById('printDiv').style.display="block";var mem=mUrl?'<img src="'+mUrl+'">':'<div style="color:#fff;text-align:center;padding-top:35px;font-size:10px">PHOTO</div>';var h='';h+='<div class="card-front"><div class="inner"><div style="font-size:19px;font-weight:900;text-align:center">TAMILAR PURATCHI IYAKKAM<br><span style="font-size:9px">தமிழர் புரட்சி இயக்கம்</span></div><div style="text-align:center;font-size:48px">🐯</div><div style="text-align:center;color:#fff;font-size:8px">PURATCHI THALAIVAR</div><div class="thalaivar-box"><img src="leader.jpg" onerror="this.src=\'thalaivar.jpg\'"></div><div style="text-align:center;color:#fff;font-size:11px;font-weight:900;margin-top:4px">'+n+'</div><div class="bg">ID: '+v+' | 2024-2029</div></div></div>';h+='<div class="card-back"><div class="inner"><div style="text-align:center;font-weight:900;font-size:13px">MEMBERSHIP CARD<br><span style="font-size:8px">உறுப்பினர் அட்டை</span></div><div style="margin-top:6px;overflow:hidden"><div class="m-photo">'+mem+'</div><div style="font-size:10px;line-height:1.25;color:gold">Name:<b style="color:#fff"> '+n+'</b><br><br>ID:<b style="color:#fff"> '+v+'</b><br>Pathavi:<b style="color:#fff"> '+p+'</b><br>Oor:<b style="color:#fff"> '+k+'</b><br>Mavattam:<b style="color:#fff"> '+m+'</b></div></div><div class="sign-box"><img src="thalaivar-sign.jpg" onerror="this.src=\'thalaivar-sign.jpeg\'"><div style="font-size:5px;color:#000;font-weight:900">THALAIVAR SIGN</div></div><div class="bg">TAMILAR PURATCHI IYAKKAM • NON-TRANSFERABLE</div></div></div>';document.getElementById('cardDiv').innerHTML=h}</script></body></html>
