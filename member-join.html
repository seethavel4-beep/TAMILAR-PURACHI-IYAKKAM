<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TPI COMPACT</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial;padding:8px}.head{background:#cc0000;color:gold;padding:10px;text-align:center;font-weight:900;border:2px solid gold;border-radius:10px;font-size:14px}.form{max-width:500px;margin:10px auto;background:#fff;padding:12px;border-radius:10px}.form input,.form select{width:100%;padding:10px;margin:4px 0;border:2px solid #c00;border-radius:6px;font-weight:bold}.btn{width:100%;padding:12px;background:#c00;color:#fff;border:2px solid gold;border-radius:20px;font-weight:900;margin-top:6px}.cards{display:none;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}.card{width:350px;background:#8B0000;border:3px solid gold;border-radius:10px;position:relative;overflow:hidden}.front{height:500px}.back{height:380px}.inner{border:2px solid gold;margin:5px;height:calc(100% - 10px);border-radius:6px;padding:8px;color:gold;position:relative;display:flex;flex-direction:column}.thalaivar-box{width:195px;height:240px;border:3px solid gold;border-radius:8px;margin:8px auto;overflow:hidden;background:#fff;box-shadow:0 0 12px gold}.thalaivar-box img{width:100%;height:100%;object-fit:cover}.bg-text{background:gold;color:#8B0000;font-weight:900;text-align:center;padding:5px;font-size:9px;position:absolute;bottom:0;left:0;right:0}.member-photo{width:105px;height:125px;border:2px solid gold;float:left;margin-right:8px;background:#222;overflow:hidden;border-radius:5px;flex-shrink:0}.member-photo img{width:100%;height:100%;object-fit:cover}.details{font-size:11px;line-height:1.3;color:gold}.details b{color:#fff}.sign-area-compact{margin-top:10px;display:flex;justify-content:space-between;align-items:flex-end}.sign-box-small{background:#fff;padding:6px 8px;border-radius:6px;border:2px solid gold;width:130px;text-align:center}.sign-box-small img{width:110px;height:55px;object-fit:contain}</style></head><body><div class="head">🐯 TAMILAR PURATCHI IYAKKAM<br>ID CARD</div><div class="form" id="formDiv"><input id="name" placeholder="Name"><input type="file" id="photoInput" accept="image/*"><input id="voter" placeholder="ID No"><input id="kiramam" placeholder="Oor"><input id="mavattam" placeholder="Mavattam"><select id="pathavi"><option>உறுப்பினர்</option><option selected>ஒருங்கிணைப்பாளர்</option><option>மாவட்ட செயலாளர்</option></select><button class="btn" onclick="makeCard()">✅ GENERATE</button></div><div class="cards" id="cardDiv"></div><div style="text-align:center;display:none;margin-top:10px" id="printDiv"><button class="btn" style="max-width:280px;background:#000" onclick="window.print()">🖨️ PRINT</button></div><script>var mUrl="";document.getElementById('photoInput').addEventListener('change',function(e){if(e.target.files&&e.target.files[0])mUrl=URL.createObjectURL(e.target.files[0])});function makeCard(){var n=document.getElementById('name').value||"A.VELMURUGAN";var v=document.getElementById('voter').value||"UBU0443952";var k=document.getElementById('kiramam').value||"Aruppukkottai";var m=document.getElementById('mavattam').value||"Virudhunagar";var p=document.getElementById('pathavi').value;document.getElementById('formDiv').style.display="none";document.getElementById('cardDiv').style.display="flex";document.getElementById('printDiv').style.display="block";var mem=mUrl?'<img src="'+mUrl+'">':'<div style="color:#fff;text-align:center;padding-top:40px;font-size:11px">PHOTO</div>';var h='';h+='<div class="card front"><div class="inner"><div style="font-size:20px;font-weight:900;text-align:center">TAMILAR PURATCHI IYAKKAM<br><span style="font-size:10px">தமிழர் புரட்சி இயக்கம்</span></div><div style="text-align:center;font-size:55px;margin:4px">🐯</div><div style="text-align:center;color:#fff;font-size:9px">PURATCHI THALAIVAR</div><div class="thalaivar-box"><img src="leader.jpg" onerror="this.src=\'thalaivar.jpg\'"></div><div style="text-align:center;color:#fff;font-size:12px;font-weight:900;margin-top:5px">'+n+'</div><div class="bg-text">ID: '+v+' | VALID 2024-2029</div></div></div>';h+='<div class="card back"><div class="inner"><div style="text-align:center;font-weight:900;font-size:14px">MEMBERSHIP CARD<br><span style="font-size:9px">உறுப்பினர் அட்டை</span></div><div style="margin-top:8px;display:flex"><div class="member-photo">'+mem+'</div><div class="details">Name:<b> '+n+'</b><br><br>ID:<b> '+v+'</b><br>Pathavi:<b> '+p+'</b><br>Oor:<b> '+k+'</b><br>Mavattam:<b> '+m+'</b></div></div><div style="flex-grow:1"></div><div class="sign-area-compact"><div style="font-size:9px;color:#fff">Valid: 2029</div><div class="sign-box-small"><img src="thalaivar-sign.jpg" onerror="this.src=\'thalaivar-sign.jpeg\'"><div style="font-size:6px;color:#000;font-weight:900;margin-top:2px">THALAIVAR SIGN</div></div></div><div class="bg-text">TAMILAR PURATCHI IYAKKAM • NON-TRANSFERABLE</div></div></div>';document.getElementById('cardDiv').innerHTML=h}</script></body></html>
