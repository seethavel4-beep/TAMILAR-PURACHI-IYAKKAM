<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TPI ID CARD</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial;padding:10px}.head{background:#cc0000;color:gold;padding:14px;text-align:center;font-weight:900;border:2px solid gold;border-radius:10px}.form{max-width:500px;margin:12px auto;background:#fff;padding:14px;border-radius:12px}.form input,.form select{width:100%;padding:11px;margin:5px 0;border:2px solid #c00;border-radius:8px;font-weight:bold}.btn{width:100%;padding:13px;background:#c00;color:#fff;border:2px solid gold;border-radius:30px;font-weight:900;font-size:16px;margin-top:8px}.cards{display:none;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:20px}.card{width:360px;height:560px;background:#8B0000;border:3px solid gold;border-radius:12px;position:relative;overflow:hidden}.inner{border:2px solid gold;margin:6px;height:calc(100% - 12px);border-radius:8px;padding:10px;color:gold;position:relative}.thalaivar-box{width:200px;height:270px;border:3px solid gold;border-radius:10px;margin:10px auto;overflow:hidden;background:#fff;box-shadow:0 0 15px gold}.thalaivar-box img{width:100%;height:100%;object-fit:cover}.bg-text{background:gold;color:#8B0000;font-weight:900;text-align:center;padding:6px;font-size:10px;position:absolute;bottom:0;left:0;right:0}.member-photo{width:110px;height:135px;border:2px solid gold;float:left;margin-right:10px;background:#222;overflow:hidden;border-radius:6px}.member-photo img{width:100%;height:100%;object-fit:cover}.sign-area{position:absolute;right:8px;bottom:38px;background:#fff;padding:8px 10px;border-radius:8px;border:2px solid gold;width:150px;text-align:center}.sign-area img{width:130px;height:65px;object-fit:contain}</style></head><body><div class="head">🐯 TAMILAR PURATCHI IYAKKAM<br>FRONT=THALAIVAR | BACK=SIGN</div><div class="form" id="formDiv"><input id="name" placeholder="Name - M.SELVAM"><input type="file" id="photoInput" accept="image/*"><small style="color:#c00">Member Photo</small><input id="voter" placeholder="ID No"><input id="kiramam" placeholder="Oor"><input id="mavattam" placeholder="Mavattam"><select id="pathavi"><option>உறுப்பினர்</option><option selected>ஒருங்கிணைப்பாளர்</option><option>மாவட்ட செயலாளர்</option></select><button class="btn" onclick="makeCard()">✅ GENERATE ID CARD</button></div><div class="cards" id="cardDiv"></div><div style="text-align:center;display:none;margin-top:15px" id="printDiv"><button class="btn" style="max-width:300px;background:#000" onclick="window.print()">🖨️ PRINT</button></div><script>var memberPhotoUrl="";document.getElementById('photoInput').addEventListener('change',function(e){if(e.target.files&&e.target.files[0])memberPhotoUrl=URL.createObjectURL(e.target.files[0])});function makeCard(){var n=document.getElementById('name').value||"M.SELVAM";var v=document.getElementById('voter').value||"TPI-"+Math.floor(Math.random()*90000);var k=document.getElementById('kiramam').value||"Vriddhachalam";var m=document.getElementById('mavattam').value||"Cuddalore";var p=document.getElementById('pathavi').value;document.getElementById('formDiv').style.display="none";document.getElementById('cardDiv').style.display="flex";document.getElementById('printDiv').style.display="block";var memberImgHtml=memberPhotoUrl?'<img src="'+memberPhotoUrl+'">':'<div style="color:white;text-align:center;padding-top:50px">MEMBER PHOTO</div>';var html='';html+='<div class="card"><div class="inner"><div style="font-size:22px;font-weight:900;text-align:center">TAMILAR PURATCHI IYAKKAM<br><span style="font-size:11px">தமிழர் புரட்சி இயக்கம்</span></div><div style="text-align:center;font-size:70px;margin:5px">🐯</div><div style="text-align:center;color:#fff;font-size:10px">PURATCHI THALAIVAR</div><div class="thalaivar-box"><img src="leader.jpg" onerror="this.src=\'thalaivar.jpg\'"></div><div style="text-align:center;color:#fff;font-size:13px;font-weight:900;margin-top:6px">'+n+'</div><div class="bg-text">ID: '+v+' | VALID 2024-2029</div></div></div>';html+='<div class="card"><div class="inner"><div style="text-align:center;font-weight:900">MEMBERSHIP CARD<br><span style="font-size:10px">உறுப்பினர் அட்டை</span></div><div style="margin-top:12px;overflow:hidden"><div class="member-photo">'+memberImgHtml+'</div><div style="font-size:12px;line-height:1.4;color:gold">Name:<b style="color:#fff"> '+n+'</b><br><br>ID:<b style="color:#fff"> '+v+'</b><br>Pathavi:<b style="color:#fff"> '+p+'</b><br>Oor:<b style="color:#fff"> '+k+'</b><br>Mavattam:<b style="color:#fff"> '+m+'</b></div></div><div class="sign-area"><img src="thalaivar-sign.jpg" onerror="this.src=\'thalaivar-sign.jpeg\'"><div style="font-size:7px;color:#000;font-weight:900">THALAIVAR SIGN</div></div><div class="bg-text">TAMILAR PURATCHI IYAKKAM • NON-TRANSFERABLE</div></div></div>';document.getElementById('cardDiv').innerHTML=html}</script></body></html>
