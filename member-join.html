<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TPI - Thalaivar Front & Sign Back</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:Arial;padding:10px}
.h{background:#c00;color:gold;padding:12px;text-align:center;font-weight:900;border:2px solid gold;border-radius:10px}
.fm{background:#fff;color:#000;padding:12px;border-radius:12px;max-width:500px;margin:10px auto}
.fm label{font-weight:900;font-size:13px;color:#c00;display:block;margin-top:8px}
.fm input,.fm select{width:100%;padding:10px;margin:3px 0;border:2px solid #c00;border-radius:8px;font-weight:bold}
.btn{width:100%;padding:12px;background:#c00;color:#fff;border:2px solid gold;border-radius:30px;font-weight:900;margin-top:10px;font-size:16px}
.cards{display:none;flex-wrap:wrap;gap:15px;justify-content:center;margin-top:15px}
.c{width:360px;height:560px;background:#8B0000;border:3px solid gold;border-radius:12px;position:relative;overflow:hidden}
.g{border:2px solid gold;margin:6px;height:calc(100% - 12px);border-radius:8px;padding:10px;color:gold;position:relative}
.ft{font-size:22px;font-weight:900;text-align:center;line-height:1.1}
.tigerbox{width:100%;height:120px;display:flex;align-items:center;justify-content:center;font-size:90px;background:radial-gradient(gold,#8B0000);border-radius:10px}
.thalaivar-front{width:180px;height:220px;border:3px solid gold;border-radius:10px;margin:10px auto;overflow:hidden;background:#fff;box-shadow:0 0 15px gold}
.thalaivar-front img{width:100%;height:100%;object-fit:cover}
.bg{background:gold;color:#8B0000;font-weight:900;text-align:center;padding:5px;font-size:10px;position:absolute;bottom:0;left:0;right:0}
.mp{width:110px;height:130px;border:2px solid gold;float:left;margin-right:10px;background:#333;overflow:hidden;border-radius:6px}
.mp img{width:100%;height:100%;object-fit:cover}
.d{font-size:12px;line-height:1.3;color:gold}
.d b{color:#fff}
.sign-box{position:absolute;right:10px;bottom:30px;text-align:center;background:#fff;padding:5px 15px;border-radius:6px;border:2px solid gold}
.sign-box img{width:80px;height:40px;object-fit:contain}
.sign-box div{font-size:8px;color:#8B0000;font-weight:900}
@media print{.h,.fm,#printBox{display:none}.cards{display:flex!important}}
</style>
</head>
<body>

<div class="h">🐯 TAMILAR PURATCHI IYAKKAM<br>FRONT: THALAIVAR PHOTO | BACK: SIGN</div>

<div class="fm" id="formBox">
<label>முழு பெயர் *</label><input id="name" placeholder="M. SELVAM">
<label>மொபைல் எண் *</label><input id="mob" placeholder="98765 43210">
<label>உறுப்பினர் புகைப்படம் *</label><input type="file" id="photo" accept="image/*">
<label>வாக்காளர் எண் *</label><input id="voter" placeholder="TPI ID">
<label>கிராமம் / நகரம் *</label><input id="kiramam" placeholder="கிராமம்">
<label>மாவட்டம் *</label><input id="mavattam" placeholder="மாவட்டம்">
<label>பதவி *</label><select id="pathavi"><option>உறுப்பினர்</option><option selected>ஒருங்கிணைப்பாளர்</option><option>மாவட்ட செயலாளர்</option></select>
<button class="btn" onclick="generate()">✅ ID CARD GENERATE</button>
</div>

<div class="cards" id="cards"></div>
<div style="text-align:center;display:none" id="printBox"><button class="btn" style="max-width:320px;background:#000" onclick="window.print()">🖨️ PRINT ID CARD</button><br><button class="btn" style="max-width:320px;background:#222" onclick="location.reload()">🔄 NEW</button></div>

<script>
let memUrl='';
document.getElementById('photo').addEventListener('change',e=>{ if(e.target.files[0]) memUrl=URL.createObjectURL(e.target.files[0]); });
function generate(){
 let n=document.getElementById('name').value||'M. SELVAM';
 let voter=document.getElementById('voter').value||'TPI-'+Math.floor(Math.random()*100000);
 let kir=document.getElementById('kiramam').value||'THENI';
 let mav=document.getElementById('mavattam').value||'THENI';
 let pat=document.getElementById('pathavi').value;
 document.getElementById('formBox').style.display='none';
 document.getElementById('cards').style.display='flex';
 document.getElementById('printBox').style.display='block';
 document.getElementById('cards').innerHTML=`
<!-- FRONT PAGE - THALAIVAR PHOTO -->
<div class="c"><div class="g">
<div class="ft">TAMILAR PURATCHI IYAKKAM<br><span style="font-size:11px">தமிழர் புரட்சி இயக்கம்</span></div>
<div class="tigerbox">🐯</div>
<div style="text-align:center;font-size:10px;margin:5px;color:#fff">PURATCHI THALAIVAR</div>
<div class="thalaivar-front"><img src="thalaivar.jpg" onerror="this.src='flag.jpg'"></div>
<div style="text-align:center;font-size:9px;color:#fff">FOUNDER & PRESIDENT</div>
<div class="bg">VALID 2024-2029 • ID: ${voter}</div>
</div></div>

<!-- BACK PAGE - MEMBER + THALAIVAR SIGN -->
<div class="c"><div class="g">
<div style="text-align:center;font-weight:900">MEMBERSHIP CARD<br><span style="font-size:10px">உறுப்பினர் அட்டை</span></div>
<div style="margin-top:10px;overflow:hidden">
<div class="mp">${memUrl?`<img src="${memUrl}">`:`MEMBER PHOTO`}</div>
<div class="d">
பெயர்: <b>${n}</b><br><br>
ID: <b>${voter}</b><br>
பதவி: <b>${pat}</b><br>
ஊர்: <b>${kir}</b><br>
மாவட்டம்: <b>${mav}</b><br><br>
Valid: 2029
</div>
</div>
<div class="sign-box">
<img src="thalaivar-sign.jpg" onerror="this.src='thalaivar.jpg'" style="filter:contrast(2)">
<div>THALAIVAR SIGN<br>தலைவர் கையொப்பம்</div>
</div>
<div style="position:absolute;left:10px;bottom:30px;font-size:7px;color:#fff">TPI • tpi.org.in/verify</div>
<div class="bg">NON-TRANSFERABLE • TAMILAR PURATCHI IYAKKAM</div>
</div></div>
`;
}
</script>
</body>
 </html>
