<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Login - Tamilar Puratchi Iyakkam</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial;padding:15px;min-height:100vh}.box{max-width:420px;margin:20px auto;background:linear-gradient(145deg,#8B0000,#400);border:3px solid gold;border-radius:15px;padding:20px;box-shadow:0 0 20px rgba(255,215,0,0.3)}.logo{font-size:50px;text-align:center}.title{text-align:center;color:gold;font-weight:900;font-size:22px;margin:10px 0}.sub{text-align:center;color:#ccc;font-size:12px;margin-bottom:15px}input{width:100%;padding:12px;margin:8px 0;border:2px solid gold;border-radius:8px;background:#000;color:#fff;font-size:15px}input::placeholder{color:#999}button{width:100%;padding:14px;background:gold;color:#8B0000;border:none;border-radius:25px;font-weight:900;font-size:16px;margin-top:15px;cursor:pointer}button:hover{background:#ffeb3b}.link{text-align:center;margin-top:15px}.link a{color:gold;text-decoration:none;font-size:13px}</style></head><body><div class="box"><div class="logo">🐯</div><div class="title">TAMILAR PURATCHI IYAKKAM</div><div class="sub">தமிழர் புரட்சி இயக்கம் - உறுப்பினர் நுழைவு</div><input id="name" placeholder="👤 பெயர் / Name"><input id="phone" placeholder="📱 Mobile Number"><input id="place" placeholder="📍 ஊர் / Place"><button onclick="login()">🔥 LOGIN / JOIN</button><div class="link"><a href="index.html">📖 1 to 10 பக்கங்கள் படிக்க - Main Page</a></div></div><script>function login(){let n=document.getElementById('name').value;let p=document.getElementById('phone').value;if(!n||!p){alert('பெயர் மற்றும் போன் நம்பர் போடுங்க Anna!');return;}localStorage.setItem('tpi_member',JSON.stringify({name:n,phone:p,place:document.getElementById('place').value}));alert('வணக்கம் '+n+' Anna! 🐯 ID Card Generate பண்ணலாம்!');window.location.href='index.html#p10'}</script></body></html>
