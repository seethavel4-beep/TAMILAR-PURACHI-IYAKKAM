<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TPI Join - Tamilnadu</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#fff0f0;padding:10px;font-family:sans-serif}.box{max-width:520px;margin:auto;background:#fff;border:3px solid #c40000;border-radius:14px;padding:16px}h2{background:#000;color:#ff0;text-align:center;padding:12px;border-radius:10px;border:2px solid #c40000;font-size:17px}label{display:block;margin:12px 0 4px;color:#c40000;font-weight:900;font-size:14px}input,textarea{width:100%;padding:12px;border:2px solid #c40000;border-radius:10px;font-size:14px;outline:none}input:focus,textarea:focus{border-color:#000}::placeholder{color:#888}.btn{width:100%;padding:14px;background:#c40000;color:#fff;border:3px solid #000;border-radius:12px;font-weight:900;font-size:16px;margin-top:14px;cursor:pointer}.idcard{margin-top:16px;border:3px solid #000;border-radius:12px;padding:12px;background:linear-gradient(135deg,#ff0,#fff);display:none}.idcard img{width:85px;height:85px;border:3px solid #000;border-radius:10px;object-fit:cover}</style></head><body><div class="box"><h2>🐯 தமிழர் புரட்சி இயக்கம்<br><small style="color:#fff;font-size:11px">TAMILNADU - MEMBER JOIN</small></h2>
<form id="f">
<label>முழு பெயர் *</label><input id="name" placeholder="Full Name" required>
<label>பிறந்த தேதி *</label><input id="dob" type="date" required>
<label>மொபைல் எண் *</label><input id="mobile" placeholder="Mobile" required>
<label>புகைப்படம் *</label><input id="photo" type="file" accept="image/*" required>
<label>வாக்காளர் எண் (Voter ID) *</label><input id="voter" placeholder="UBU0443952" required style="text-transform:uppercase">
<label>முகவரி (Address) *</label><textarea id="addr" rows="2" placeholder="Full Address" required></textarea>
<label>வார்டு எண் (Ward Number)</label><input id="ward" placeholder="Ward No">
<label>கிராமம் / நகரம் *</label><input id="village" placeholder="Kiramam / Nagaram" required>
<label>தாலுகா *</label><input id="taluk" placeholder="Taluka" required>
<label>மாவட்டம் *</label><input id="dist" placeholder="Mavattam - Ex: Cuddalore" required>
<label>மண்டலம் (Mandalam)</label><input id="mandalam" placeholder="Mandalam">
<button class="btn" type="submit">✨ ID CARD உருவாக்கு + Save</button>
</form>
<div id="card" class="idcard"><h3 style="text-align:center">🪪 TPI ID CARD</h3><div style="display:flex;gap:10px;margin-top:10px"><img id="cphoto"><div><p id="cname" style="font-weight:900"></p><p id="cvoter" style="color:#c40000;font-weight:bold"></p><p id="cdist" style="font-size:13px"></p><p id="caddr" style="font-size:12px"></p></div></div><button class="btn" onclick="window.print()" style="background:#000;color:#ff0">🖨️ Print</button><a href="index.html" style="display:block;text-align:center;margin-top:10px;color:#c40000;font-weight:bold;text-decoration:none">← Home</a></div></div>
<script>
const f=document.getElementById('f');
f.onsubmit=e=>{
 e.preventDefault();
 let r=new FileReader();
 r.onload=()=>{
  let m={id:Date.now(),name:name.value,dob:dob.value,mobile:mobile.value,photo:r.result,voter:voter.value.toUpperCase(),addr:addr.value,ward:ward.value,village:village.value,taluk:taluk.value,dist:dist.value,mandalam:mandalam.value,date:new Date().toLocaleDateString('ta-IN')};
  let all=JSON.parse(localStorage.getItem('tpi_members')||'[]');all.push(m);localStorage.setItem('tpi_members',JSON.stringify(all));
  cphoto.src=m.photo;cname.innerText=m.name;cvoter.innerText='Voter: '+m.voter;cdist.innerText=m.dist+' | '+m.taluk+' | '+m.mandalam;caddr.innerText=m.village+' - Ward '+m.ward+' - '+m.addr;
  card.style.display='block';f.style.display='none';scrollTo(0,9999);
 };
 r.readAsDataURL(photo.files[0]);
}
</script></body></html>
